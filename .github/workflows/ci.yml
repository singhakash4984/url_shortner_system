
name: URL Shortener CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Backend Build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Verify production entry point
        run: test -f dist/server.js

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate Docker image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy to Local Ubuntu
    needs: build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: [self-hosted, Linux, X64, local-deploy]

    permissions:
      contents: read
      packages: read

    timeout-minutes: 15
    env:
      IMAGE_TAG: sha-${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify local runner
        run: |
          echo "GitHub Actions is running on my Ubuntu machine"
          echo "Hostname: $(hostname)"
          echo "User: $(whoami)"
          echo "Architecture: $(uname -m)"
          docker --version
          docker compose version
          docker info --format 'Docker server: {{.ServerVersion}}'


      - name: Prepare deployment environment
        run: |
          SOURCE_ENV="/home/demonking/Desktop/backend_development/url_shortner_system/backend/.env.docker"

          test -f "$SOURCE_ENV" || {
            echo "Deployment environment file is missing"
            exit 1
          }

          install -m 600 "$SOURCE_ENV" backend/.env.docker
          echo "Deployment environment file prepared"

      - name: Validate deployment configuration
        run: |
          test -f backend/docker-compose.yml
          docker network inspect url-shortner-network
          docker compose -f backend/docker-compose.yml config --quiet
