x-api-common: &api-common
  image: ghcr.io/singhakash4984/url_shortner_system:${IMAGE_TAG:?IMAGE_TAG is required}
  restart: unless-stopped

  env_file:
    - .env.docker

  expose:
    - "3000"

  # Resource limits
  mem_limit: 512m
  mem_reservation: 128m
  cpus: 0.50
  pids_limit: 100

  # TCP healthcheck
  healthcheck:
    test:
      - CMD
      - node
      - -e
      - "const net = require('node:net'); const s = net.connect(3000, '127.0.0.1'); s.setTimeout(2000); s.once('connect', () => { s.end(); process.exit(0); }); s.once('error', () => process.exit(1)); s.once('timeout', () => { s.destroy(); process.exit(1); });"
    interval: 30s
    timeout: 3s
    retries: 3
    start_period: 15s

  networks:
    - url-shortner-network

services:
  api1:
    <<: *api-common
    container_name: url-shortner-api1

  api2:
    <<: *api-common
    container_name: url-shortner-api2

  api3:
    <<: *api-common
    container_name: url-shortner-api3

networks:
  url-shortner-network:
    external: true
